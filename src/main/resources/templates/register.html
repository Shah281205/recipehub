<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Recipe Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f0;
        }

        .container {
            width: 400px;
            margin: 70px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #ddd;
        }

        h1 {
            text-align: center;
            color: #ff7043;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            background: #ff7043;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #ff7043;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🍴 Recipe Hub</h1>

    <h2>Create Account</h2>

   <form action="/register" method="post">

    <label>Name</label>
    <input type="text" name="name" placeholder="Enter your name" required>

    <label>Email</label>
    <input type="email" name="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" name="password" placeholder="Enter password" required>

    <label>Role</label>
    <select name="role">
        <option value="USER">User</option>
        <option value="ADMIN">Admin</option>
    </select>

    <button type="submit">Register</button>

</form>
