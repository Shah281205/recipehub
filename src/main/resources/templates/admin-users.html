<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Hub - Manage Users</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .navbar {
            background: #ff7043;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.18);
            padding: 9px 14px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h2 {
            margin-top: 0;
            color: #333;
        }

        .header p {
            color: #666;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #ff7043;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            color: #444;
        }

        tr:hover {
            background: #fafafa;
        }

        .role {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .admin {
            background: #ffe0b2;
            color: #e65100;
        }

        .user {
            background: #e3f2fd;
            color: #1565c0;
        }

        .delete-btn {
            border: none;
            background: #e53935;
            color: white;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .delete-btn:hover {
            background: #c62828;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        .count {
            margin-top: 10px;
            color: #666;
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <h1>🍳 Recipe Hub - Admin</h1>

        <div class="nav-links">

            <a href="/admin/dashboard">
                Dashboard
            </a>

            <a href="/admin/recipes">
                Recipes
            </a>

            <a href="/admin/settings">
                Settings
            </a>

            <a href="/logout">
                Logout
            </a>

        </div>

    </div>


    <!-- MAIN CONTENT -->

    <div class="container">

        <div class="header">

            <h2>👥 Manage Users</h2>

            <p>
                View and manage all registered Recipe Hub users.
            </p>

            <div class="count">
                Total Users:
                <strong th:text="${users.size()}">0</strong>
            </div>

        </div>


        <!-- USER TABLE -->

        <div class="table-container">

            <div th:if="${users == null or users.isEmpty()}"
                 class="empty">

                <h3>👤 No Users Found</h3>

                <p>
                    There are currently no registered users.
                </p>

            </div>


            <table th:unless="${users == null or users.isEmpty()}">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Email</th>

                        <th>Role</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}">
                            1
                        </td>


                        <td th:text="${user.name}">
                            Shah
                        </td>


                        <td th:text="${user.email}">
                            example@gmail.com
                        </td>


                        <td>

                            <span class="role admin"
                                  th:if="${user.role != null and user.role.equalsIgnoreCase('ADMIN')}">

                                👑 ADMIN

                            </span>


                            <span class="role user"
                                  th:unless="${user.role != null and user.role.equalsIgnoreCase('ADMIN')}">

                                👤 USER

                            </span>

                        </td>


                        <td>

                            <form action="/admin/users/delete"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this user?');">

                                <input type="hidden"
                                       name="id"
                                       th:value="${user.id}">

                                <button type="submit"
                                        class="delete-btn">

                                    🗑️ Delete

                                </button>

                            </form>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
