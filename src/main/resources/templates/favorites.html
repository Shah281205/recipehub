<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Hub - My Favorites</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
        }

        .navbar {
            background-color: #e67e22;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            width: 900px;
            max-width: 92%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #e67e22;
            margin-bottom: 30px;
        }

        .recipe-card {
            background-color: white;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .recipe-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .no-image {
            height: 220px;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
        }

        .recipe-content {
            padding: 25px;
        }

        .recipe-card h2 {
            color: #e67e22;
            margin-top: 0;
        }

        .recipe-card h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .recipe-card p {
            color: #555;
            line-height: 1.6;
            white-space: pre-line;
        }

        .view-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .view-button:hover {
            background-color: #2980b9;
        }

        .remove-button {
            margin-top: 15px;
            padding: 10px 18px;
            background-color: #c0392b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-button:hover {
            background-color: #a93226;
        }

        .no-favorites {
            background-color: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            color: #666;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .discover-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #e67e22;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back {
            display: inline-block;
            margin-top: 10px;
            margin-bottom: 30px;
            color: #e67e22;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            🍴 Recipe Hub
        </div>

    </div>


    <div class="container">

        <h1>
            ❤️ My Favorite Recipes
        </h1>


        <!-- NO FAVORITES -->

        <div th:if="${favorites.isEmpty()}"
             class="no-favorites">

            <h2>
                No Favorite Recipes Yet ❤️
            </h2>

            <p>
                You have not added any recipes to your favorites.
            </p>

            <a class="discover-button"
               href="/recipes">

                🔍 Discover Recipes

            </a>

        </div>


        <!-- FAVORITE RECIPES -->

        <div th:each="favorite : ${favorites}"
             class="recipe-card">


            <!-- IMAGE -->

            <div th:if="${favorite.recipe.imageUrl != null and !#strings.isEmpty(favorite.recipe.imageUrl)}">

                <img class="recipe-image"
                     th:src="${favorite.recipe.imageUrl}"
                     th:alt="${favorite.recipe.title}">

            </div>


            <!-- NO IMAGE -->

            <div class="no-image"
                 th:unless="${favorite.recipe.imageUrl != null and !#strings.isEmpty(favorite.recipe.imageUrl)}">

                🍳

            </div>


            <div class="recipe-content">

                <h2 th:text="${favorite.recipe.title}">
                    Recipe Name
                </h2>


                <h3>
                    🥕 Ingredients
                </h3>

                <p th:text="${favorite.recipe.ingredients}">
                    Ingredients
                </p>


                <h3>
                    👨‍🍳 Instructions
                </h3>

                <p th:text="${favorite.recipe.instructions}">
                    Instructions
                </p>


                <!-- VIEW DETAILS -->

                <a class="view-button"
                   th:href="@{/recipe-details(id=${favorite.recipe.id})}">

                    👀 View Details

                </a>


                <!-- REMOVE FAVORITE -->

                <form action="/unfavorite"
                      method="post"
                      style="display:inline;">

                    <input type="hidden"
                           name="recipeId"
                           th:value="${favorite.recipe.id}">

                    <button type="submit"
                            class="remove-button">

                        💔 Remove Favorite

                    </button>

                </form>

            </div>

        </div>


        <a class="back"
           href="/dashboard">

            ← Back to Dashboard

        </a>

    </div>

</body>

</html>
