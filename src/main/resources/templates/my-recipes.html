<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Hub - My Recipes</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
        }

        .navbar {
            background-color: #e67e22;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            width: 1000px;
            max-width: 94%;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            color: #e67e22;
            margin-bottom: 30px;
        }

        .recipe-card {
            background-color: white;
            margin-bottom: 25px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .recipe-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .no-image {
            height: 220px;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
        }

        .recipe-content {
            padding: 25px;
        }

        .recipe-content h2 {
            color: #e67e22;
            margin-top: 0;
        }

        .recipe-content h3 {
            color: #333;
            margin-bottom: 5px;
        }

        .recipe-content p {
            color: #555;
            line-height: 1.6;
            white-space: pre-line;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            background-color: #f39c12;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }

        .buttons {
            margin-top: 20px;
        }

        .edit-button {
            display: inline-block;
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 8px;
        }

        .edit-button:hover {
            background-color: #2980b9;
        }

        .delete-button {
            padding: 10px 18px;
            background-color: #c0392b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background-color: #a93226;
        }

        .empty {
            background-color: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .add-button {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 20px;
            background-color: #e67e22;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .back {
            display: inline-block;
            margin-top: 10px;
            color: #e67e22;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            🍴 Recipe Hub
        </div>

    </div>


    <div class="container">

        <h1>
            👨‍🍳 My Recipes
        </h1>


        <!-- NO RECIPES -->

        <div class="empty"
             th:if="${recipes.isEmpty()}">

            <h2>
                No Recipes Yet 🍳
            </h2>

            <p>
                You have not added any recipes yet.
            </p>

            <a class="add-button"
               href="/add-recipe">

                ➕ Add Your First Recipe

            </a>

        </div>


        <!-- RECIPES -->

        <div th:each="recipe : ${recipes}"
             class="recipe-card">


            <!-- IMAGE -->

            <div th:if="${recipe.imageUrl != null and !#strings.isEmpty(recipe.imageUrl)}">

                <img class="recipe-image"
                     th:src="${recipe.imageUrl}"
                     th:alt="${recipe.title}">

            </div>


            <!-- NO IMAGE -->

            <div class="no-image"
                 th:unless="${recipe.imageUrl != null and !#strings.isEmpty(recipe.imageUrl)}">

                🍳

            </div>


            <div class="recipe-content">

                <h2 th:text="${recipe.title}">
                    Recipe Name
                </h2>


                <h3>
                    🥕 Ingredients
                </h3>

                <p th:text="${recipe.ingredients}">
                    Ingredients
                </p>


                <h3>
                    👨‍🍳 Instructions
                </h3>

                <p th:text="${recipe.instructions}">
                    Instructions
                </p>


                <h3>
                    Status
                </h3>

                <span class="status"
                      th:text="${recipe.status}">
                    PENDING
                </span>


                <!-- BUTTONS -->

                <div class="buttons">

                    <a class="edit-button"
                       th:href="@{/edit-recipe(id=${recipe.id})}">

                        ✏️ Edit

                    </a>


                    <form action="/delete-recipe"
                          method="post"
                          style="display:inline;">

                        <input type="hidden"
                               name="id"
                               th:value="${recipe.id}">

                        <button type="submit"
                                class="delete-button"
                                onclick="return confirm('Are you sure you want to delete this recipe?');">

                            🗑️ Delete

                        </button>

                    </form>

                </div>

            </div>

        </div>


        <br>

        <a class="back"
           href="/dashboard">

            ← Back to Dashboard

        </a>

    </div>

</body>

</html>
