<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recipe Hub - Add Recipe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8f0;
        }

        .navbar {
            background-color: #e67e22;
            color: white;
            padding: 18px 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .container {
            width: 600px;
            max-width: 90%;
            margin: 40px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #e67e22;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #d35400;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #e67e22;
            text-decoration: none;
        }

        .hint {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            🍴 Recipe Hub
        </div>

    </div>


    <div class="container">

        <h1>
            🍳 Add Your Recipe
        </h1>


        <form action="/add-recipe"
              method="post">


            <!-- RECIPE NAME -->

            <label>
                Recipe Name
            </label>

            <input type="text"
                   name="title"
                   placeholder="Enter recipe name"
                   required>


            <!-- IMAGE URL -->

            <label>
                🖼️ Recipe Image URL
            </label>

            <input type="url"
                   name="imageUrl"
                   placeholder="Paste image URL here">

            <p class="hint">
                Example: https://example.com/food.jpg
            </p>


            <!-- INGREDIENTS -->

            <label>
                Ingredients
            </label>

            <textarea name="ingredients"
                      placeholder="Enter ingredients"
                      required></textarea>


            <!-- INSTRUCTIONS -->

            <label>
                Instructions
            </label>

            <textarea name="instructions"
                      placeholder="Enter cooking instructions"
                      required></textarea>


            <!-- SAVE -->

            <button type="submit">
                💾 Save Recipe
            </button>

        </form>


        <a class="back"
           href="/dashboard">

            ← Back to Dashboard

        </a>

    </div>

</body>

</html>
